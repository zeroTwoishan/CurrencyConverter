<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Glowing Background Circle -->
  <circle cx="256" cy="256" r="220" fill="url(#grad1)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad1)" stroke-width="24" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="50" />
  
  <!-- Exchange Arrows -->
  <path d="M 360 200 L 160 200 L 210 150 M 160 200 L 210 250" fill="none" stroke="url(#grad2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 152 312 L 352 312 L 302 262 M 352 312 L 302 362" fill="none" stroke="url(#grad1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Currency symbols -->
  <text x="210" y="230" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">$</text>
  <text x="302" y="325" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">₹</text>
</svg>